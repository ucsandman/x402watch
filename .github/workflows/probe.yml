name: probe

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/probe.ts
      - name: Commit data
        run: |
          git config user.name "x402watch probe"
          git config user.email "probe@x402watch.local"
          git add data/latest.json data/history.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "probe: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
